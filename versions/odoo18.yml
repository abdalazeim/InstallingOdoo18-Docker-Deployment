# Odoo 18 Multi-Instance Variables
odoo_version: "18"
postgres_version: "17"
odoo_image: "odoo:18"
postgres_image: "postgres:17"
docker_network: "proxy"
traefik_entrypoint: "websecure"
traefik_certresolver: "letsencrypt"

odoo_instances:
  - name: instance1
    project: odoo18_instance1
    domain: ${ODOO18_INSTANCE1_DOMAIN:-odoo18-1.localhost}
    data_path: /data/odoo18/instance1
    config_path: /opt/odoo18/instance1
    http_port: 8069
    chat_port: 8072
    db_name: odoo18_db1
    db_user: odoo18_instance1
    container_name: odoo18-instance1
    traefik_enabled: true

  - name: instance2
    project: odoo18_instance2
    domain: ${ODOO18_INSTANCE2_DOMAIN:-odoo18-2.localhost}
    data_path: /data/odoo18/instance2
    config_path: /opt/odoo18/instance2
    http_port: 8069
    chat_port: 8072
    db_name: odoo18_db2
    db_user: odoo18_instance2
    container_name: odoo18-instance2
    traefik_enabled: true