services:
  db:
    container_name: ${ODOO_DB_CONTAINER_NAME:-odoo18-db}
    image: ${PG_IMAGE:-postgres:17}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo18}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo@18}
      POSTGRES_DB: ${POSTGRES_DB:-postgre}
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  odoo18:
    container_name: ${ODOO_CONTAINER_NAME:-odoo18}
    image: ${ODOO_IMAGE:-odoo:18}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    command: ["--config=/tmp/odoo.conf"]
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo18}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo@18}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-Admin@18}
      ODOO_PROXY_MODE: "False"
    ports:
      - "${ODOO_HTTP_PORT:-10018}:8069"
      - "${ODOO_CHAT_PORT:-20018}:8072"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./addons:/mnt/extra-addons:ro
      - ./etc:/etc/odoo:ro
      - odoo_data:/var/lib/odoo
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  internal:
    name: ${ODOO_NETWORK:-odoo18_internal}
    driver: bridge

volumes:
  odoo_data:
    name: ${ODOO_DATA_VOLUME:-odoo18_data}
